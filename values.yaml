app:
  name: myapp
  image: nginx
  version: latest
  port: 80
  replicas: 2

service:
  type: NodePort
  port: 80
  nodeport: 30080
httpRoute:
  enabled: false

ingress:
  enabled: false

# helmfile.yaml
================
helm create nginx-dev
helmfile.yaml

releases:
    - name: nginx-dev
      chart: ./nginx-dev
      values:
        - ./nginx-dev/values.yaml
